[project]
name = "django-tasks-sqs"
version = "0.1.0"
description = "Amazon SQS backend and worker for Django's built-in tasks framework (django.tasks)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Miguel Ángel García Gandía", email = "mgarcia0094@gmail.com" }]
requires-python = ">=3.12"
dependencies = ["django>=6.0", "boto3>=1.35"]
keywords = ["django", "tasks", "sqs", "aws", "background-jobs", "queue", "worker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/mgarcia0094/django-tasks-sqs"
Repository = "https://github.com/mgarcia0094/django-tasks-sqs"
Issues = "https://github.com/mgarcia0094/django-tasks-sqs/issues"
Changelog = "https://github.com/mgarcia0094/django-tasks-sqs/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-django>=4.9",
    "moto[sqs]>=5.1.8",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs>=5.1",
    "boto3-stubs[sqs]>=1.34",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
exclude = ["*.md"]  # keep README snippets as written

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "N", "DJ"]
ignore = ["N818"]  # InvalidMessage mirrors django.tasks' InvalidTask naming

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--strict-markers", "--cov=django_tasks_sqs", "--cov-report=term-missing"]
filterwarnings = [
    "error",
    # Old botocore/moto releases (hit by the lowest-dependency CI job) use utcnow().
    "ignore:datetime.datetime.utcnow:DeprecationWarning",
]

[tool.coverage.report]
fail_under = 95
exclude_also = ["if TYPE_CHECKING:"]
